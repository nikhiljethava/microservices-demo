# emailservice - tracing
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: emailservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: COLLECTOR_SERVICE_ADDR
                value: "opentelemetrycollector:4317"
              - name: OTEL_SERVICE_NAME
                value: "emailservice"
              - name: ENABLE_TRACING
                value: "1"
              - name: DISABLE_PROFILER
                value: "1"
              # GrpcInstrumentorServer traces every inbound RPC including the
              # health checks, and the base 200m limit leaves so little CPU that
              # the 1s gRPC liveness probe times out and the pod crash-loops.
              # This is strictly enforced on Autopilot.
              resources:
                requests:
                  cpu: 300m
                  memory: 128Mi
                limits:
                  cpu: 600m
                  memory: 256Mi
