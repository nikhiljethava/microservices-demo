apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - otel-collector.yaml
patches:
# adservice - tracing via the OpenTelemetry Java agent (zero-code). The agent
# jar ships in the image; setting JAVA_TOOL_OPTIONS is what activates it.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: adservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: JAVA_TOOL_OPTIONS
                value: "-javaagent:/opt/opentelemetry-javaagent.jar"
              - name: OTEL_SERVICE_NAME
                value: "adservice"
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: "http://opentelemetrycollector:4317"
              - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: "grpc"
              - name: OTEL_TRACES_EXPORTER
                value: "otlp"
              - name: OTEL_METRICS_EXPORTER
                value: "none"
              - name: OTEL_LOGS_EXPORTER
                value: "none"
# cartservice - tracing
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cartservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: COLLECTOR_SERVICE_ADDR
                value: "opentelemetrycollector:4317"
              - name: OTEL_SERVICE_NAME
                value: "cartservice"
              - name: ENABLE_TRACING
                value: "1"
# loadgenerator - tracing. This is the root of every trace in the demo, so
# without it the frontend spans are trace roots and there is no
# loadgenerator -> frontend edge. Uses the OTLP HTTP port (4318) because
# grpcio does not play well with Locust's gevent monkey-patching.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: loadgenerator
    spec:
      template:
        spec:
          containers:
            - name: main
              env:
              - name: ENABLE_TRACING
                value: "1"
              - name: OTEL_SERVICE_NAME
                value: "loadgenerator"
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: "http://opentelemetrycollector:4318"
